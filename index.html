<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VV DOUBLE 行銷排程</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#F4F5F7;--sf:#fff;--bd:#E3E6EC;--bd2:#D9DDE6;--tx:#1F2430;--tx2:#6A7085;--tx3:#8A90A0;--ink:#1F2430;--red:#B03A3A;--redbg:#FFF7F7;--redbd:#F3C9C9;--blue:#2F6FED;--green:#1F8A5B;--amber:#B06A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:14px}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.hide{display:none!important}
svg.i{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lg{width:340px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:28px}
.lg h1{font-size:14px;letter-spacing:3px;margin:0 0 4px}
.lg p{margin:0 0 18px;color:var(--tx3);font-size:12px}
.lg input{width:100%;padding:11px 12px;border:1px solid var(--bd2);border-radius:9px;margin-bottom:10px;font-size:14px}
.lg input:focus{outline:none;border-color:var(--ink)}
.lg .err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:8px}

/* top */
.top{display:flex;align-items:center;gap:8px;padding:9px 18px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-size:12px;font-weight:700;letter-spacing:2px;margin-right:4px}
.tab{font-size:13px;padding:7px 12px;border-radius:9px;color:var(--tx2);background:none;border:none}
.tab.on{background:var(--ink);color:#fff;font-weight:700}
.sep{width:1px;height:20px;background:var(--bd);margin:0 4px}
.btn{font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--bd2);background:var(--sf);color:var(--tx)}
.btn.pr{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.dn{color:var(--red);border-color:var(--redbd)}
.btn.sm{padding:4px 9px;font-size:11px}
.wk{font-size:15px;font-weight:700;min-width:96px;text-align:center}
.chip{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--bd2);background:var(--sf);color:#4B5162;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.me{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff}
.lnk{position:absolute;top:44px;right:120px;background:var(--sf);border:1px solid var(--bd2);border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:40;min-width:200px}
.lnk a{display:block;padding:8px 12px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:13px}
.lnk a:hover{background:var(--bg)}
.lnk a span{color:var(--tx3);font-size:10px;margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden}
.seg button{font-size:12px;padding:5px 11px;color:var(--tx2);background:var(--sf);border:none}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}

/* layout */
.wrap{padding:14px 18px 110px}
.desk{display:grid;grid-template-columns:300px 1fr 300px;gap:14px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.h{font-size:11px;letter-spacing:1px;color:var(--tx3);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.h b{color:var(--tx);font-size:13px;letter-spacing:0}
.h span{margin-left:auto;font-size:10px;letter-spacing:0}
.sec{font-size:10px;letter-spacing:1px;margin:8px 0 4px;font-weight:700;color:var(--tx3)}
.empty{font-size:12px;color:#B0B5C2;padding:6px 0}

/* task item */
.it{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent;font-size:12.5px;margin-bottom:4px}
.it input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--ink);flex:none;cursor:pointer}
.it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.done{opacity:.4}.it.done .t{text-decoration:line-through}
.it.late{box-shadow:inset 0 0 0 1.5px #E05C5C}
.it.cm{background:#FFF7E0;border:1px dashed #E8C66B}
.pf{display:inline-block;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--ink);color:#fff;margin-right:5px;vertical-align:1px}
.pf.FB{background:#1C5FBF}.pf.TH{background:#555B6B}.pf.其他{background:#8A90A0}.pf.官網{background:#B06A00}.pf.YT{background:#B02020}
.lb{font-size:9px;font-weight:700;padding:0 5px;border-radius:4px;background:#fff;color:var(--amber);margin-right:5px;vertical-align:1px}
.as{font-size:9px;color:var(--tx2);background:rgba(255,255,255,.75);border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.q{font-size:10px;color:var(--tx2);background:#fff;border-radius:5px;padding:0 5px;flex:none;white-space:nowrap}
.q.l{color:var(--red);font-weight:700}
.who{font-size:9px;font-weight:700;flex:none}
.cnt{display:flex;align-items:center;gap:3px;flex:none}
.cnt button{width:24px;height:24px;border-radius:6px;border:1px solid var(--bd2);background:#fff;font-size:14px;line-height:1;padding:0}
.cnt b{font-size:11px;min-width:34px;text-align:center}
.tm{font-size:10px;color:var(--tx3);flex:none}
.xb{font-size:9px;border:1px solid var(--bd2);background:#fff;border-radius:4px;padding:1px 5px;flex:none;color:var(--tx2);line-height:1.4}
.xb.v{color:var(--blue);border-color:#BFD3FF}.xb.r{color:var(--red);border-color:var(--redbd)}
.xb.on{font-weight:700}
.tg{font-size:9px;font-weight:700;padding:0 5px;border-radius:4px;flex:none}
.tg.h{background:#FFE4E4;color:var(--red)}.tg.m{background:#E6EEFF;color:var(--blue)}

/* week rows */
.dr{display:grid;grid-template-columns:84px 1fr;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--sf);margin-bottom:6px}
.dr .rt{display:flex;flex-direction:column;gap:4px;min-width:0}
.pg2{display:grid;gap:10px;min-width:0}
.dr.hd{background:transparent;border:none;padding:0 10px;margin-bottom:2px}
.dr.today{border-color:var(--ink)}
.dr.off{background:#FAFAFB}
.ph{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;justify-self:start;color:#fff}
.dd .n{font-size:18px;font-weight:700;line-height:1}
.dd .w{font-size:11px;color:var(--tx3)}
.dd .mk{display:inline-block;margin-top:4px;font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;background:#FFF1D6;color:#B06A00}
.dd .pg{margin-top:6px;height:4px;background:#ECEEF3;border-radius:99px;overflow:hidden}
.dd .pg i{display:block;height:100%;background:var(--ink)}
.dd .pt{font-size:10px;color:var(--tx3);margin-top:3px}
.pcol{display:flex;flex-direction:column;gap:3px;min-width:0}
.addb{border:1px dashed var(--bd2);background:none;border-radius:7px;color:var(--tx3);font-size:12px;line-height:1;padding:3px 0;opacity:0}
.pcol:hover .addb{opacity:1}
.pcol{min-height:26px}
.dropon{outline:2px dashed var(--ink);outline-offset:-2px;border-radius:8px}
.dragging{opacity:.4}
[draggable=true]{cursor:grab}
.eb{border:none;background:none;padding:0 2px;color:var(--tx3);flex:none;line-height:1}
.eb:hover{color:var(--tx)}
.eb svg.i{width:12px;height:12px}
.frm{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;font-size:13px}
.frm input,.frm select{padding:8px 10px;border:1px solid var(--bd2);border-radius:8px;font-size:13px;width:100%}
.li{display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;border:1px solid transparent;font-size:12px;min-width:0}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.li input{width:14px;height:14px;margin:0;accent-color:var(--ink);cursor:pointer}
.li.done{opacity:.38}.li.done .t{text-decoration:line-through}
.li.late{box-shadow:inset 0 0 0 1.5px #E05C5C}
.cmrow{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 9px;border-radius:7px;background:#FFF7E0;border:1px dashed #E8C66B}
.cmrow input{width:14px;height:14px;margin:0;accent-color:var(--ink)}
.cmrow.done{opacity:.4;text-decoration:line-through}
.note-in{padding:5px 8px;border-radius:5px;background:#FFF3B0;font-size:11px;line-height:1.4}
.note-in.p{background:#FFD9E6}.note-in.b{background:#D9ECFF}
.note-in small{opacity:.65;margin-right:6px}

/* status / kpi */
.kp{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px;align-items:center}
.kp .g{font-size:10px;color:var(--tx3);grid-column:1/3;margin-top:4px;letter-spacing:1px}
.kp .v{font-weight:700;text-align:right;white-space:nowrap}
.kp .v.ok{color:var(--green)}.kp .v.ng{color:var(--red)}
.kp .bar{height:4px;background:#ECEEF3;border-radius:99px;grid-column:1/3;overflow:hidden;margin-top:-2px}
.kp .bar i{display:block;height:100%;background:var(--ink)}
.lt{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;border:1px solid var(--redbd);background:var(--redbg);margin-bottom:5px;font-size:12px}
.lt .d{font-size:10px;color:var(--red);font-weight:700;min-width:36px}
.lt .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;color:var(--tx3);font-weight:500;text-align:right;padding:5px 6px;border-bottom:1px solid var(--bd)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px;border-bottom:1px solid #F0F2F5;vertical-align:middle;text-align:right}
.tbl .sm{font-size:10px;color:var(--tx3)}
.cd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cdc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:12px}
.cdc b{font-size:20px;line-height:1}
.cdc.soon b{color:var(--red)}

/* plan */
.pr-row{display:grid;grid-template-columns:100px 1fr 1fr;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pr-row.today{border-color:var(--ink)}
.pr-row textarea{width:100%;min-height:96px;border:1px solid var(--bd2);border-radius:9px;padding:9px 11px;font-size:13px;line-height:1.7;resize:vertical;background:#FAFBFC}
.pr-row textarea:focus{outline:none;border-color:var(--ink);background:#fff}
.pr-row textarea.dirty{border-color:var(--amber)}
.lbl{font-size:10px;color:var(--tx3);letter-spacing:1px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.lbl .ph{font-size:10px;padding:1px 8px}
.lbl button{margin-left:auto}
.pv{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.tip{font-size:12px;color:var(--tx2);background:var(--sf);border:1px dashed var(--bd2);border-radius:10px;padding:9px 12px;display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.tip code{background:var(--bg);padding:1px 6px;border-radius:5px;font-family:inherit}
.bad{background:#FFF2F2;border:1px solid #E05C5C}

/* calendar */
.cal{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cwd{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--bd)}
.cwd div{font-size:11px;color:var(--tx3);text-align:center;padding:7px 0;letter-spacing:1px}
.cg{display:grid;grid-template-columns:repeat(7,1fr)}
.cday{border-right:1px solid #EEF0F4;border-bottom:1px solid #EEF0F4;padding:6px 7px;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:3px;position:relative;cursor:pointer}
.cday:nth-child(7n){border-right:0}
.cday.out{background:#FAFAFB}.cday.out .n{color:#C4C8D2}
.cday.today{background:#FFFDF4}
.cday.today .n{background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cday.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cday .dh{display:flex;align-items:center;gap:5px;margin-bottom:2px;min-width:0}
.cday .n{font-size:12px;font-weight:700;color:#4B5162}
.cday .mk{font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;background:#FFF1D6;color:#B06A00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cday .pg{margin-left:auto;font-size:9px;color:var(--tx3);white-space:nowrap}
.cday .pg b{color:var(--tx)}
.ct{display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 5px;border-radius:5px;line-height:1.3;border:1px solid transparent}
.ct .k{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);flex:none}
.ct.done{opacity:.4}.ct.done .k{background:var(--ink);border-color:var(--ink)}.ct.done .x{text-decoration:line-through}
.ct .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ct .q{font-size:9px}
.ct.late{box-shadow:inset 0 0 0 1.5px #E05C5C}
.more{font-size:10px;color:var(--tx2);padding:1px 5px}
.cday.past{padding:4px 7px;background:#FAFAFB;flex-direction:row;align-items:center;gap:6px}
.cday.past .dh{margin:0;gap:4px}
.cday.past .n{font-size:11px;color:#9AA0AE}
.cday.past .ct,.cday.past .more{display:none}
.cday.past .pg{margin-left:0}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.skm{position:absolute;right:6px;bottom:5px;width:14px;height:14px;background:#FFE86B;border-radius:2px;box-shadow:1px 1px 3px rgba(0,0,0,.18);transform:rotate(-6deg)}
.cday.past .skm{width:10px;height:10px;bottom:auto;top:50%;margin-top:-5px}
.calwrap{display:grid;grid-template-columns:1fr 360px;gap:14px}
.qa{display:flex;gap:6px;align-items:center;border:1px solid var(--bd2);border-radius:9px;padding:6px 8px;margin-top:8px;background:#FAFBFC}
.qa input{flex:1;border:0;background:transparent;font-size:12px;outline:0;min-width:0}
.qa button{font-size:11px}
.bar2{flex:1;height:6px;background:#ECEEF3;border-radius:99px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--ink)}
.row{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:9px;border:1px solid transparent;margin-bottom:5px;font-size:13px}
.row.done{opacity:.45}.row.done .ti{text-decoration:line-through}
.row input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.row .b{flex:1;min-width:0}
.row .ti{line-height:1.35;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.row .who{margin-top:3px}
.row.cm{background:#FFF7E0;border:1px dashed #E8C66B}
.row .act{display:flex;gap:4px;flex:none;align-items:center}

/* notes floating */
#noteLayer{position:fixed;inset:0;pointer-events:none;z-index:30}
.sk{position:absolute;pointer-events:auto;width:220px;padding:10px 12px 10px 14px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);font-size:13px;line-height:1.5;cursor:grab;border-left:4px solid rgba(0,0,0,.15);background:#FFF3B0;user-select:none}
.sk.p{background:#FFD9E6;border-left-color:#E8507A}.sk.b{background:#D9ECFF;border-left-color:#3A8FD4}.sk.y{border-left-color:#E8C200}
.sk.read{opacity:.6}
.sk .m{display:flex;align-items:center;gap:6px;font-size:10px;opacity:.7;margin-bottom:4px}
.sk .m i{margin-left:auto;font-style:normal;background:rgba(0,0,0,.08);border-radius:99px;padding:0 6px;white-space:nowrap}
.sk .tx{white-space:pre-wrap;word-break:break-word}
.sk .f{display:flex;gap:6px;margin-top:8px}
.sk .f button{font-size:11px;color:var(--tx);background:rgba(255,255,255,.65);padding:3px 8px;border-radius:6px;border:none}
.dock{position:fixed;left:18px;bottom:16px;display:flex;gap:6px;align-items:center;z-index:31}
.dock button{font-size:12px;padding:8px 13px;border-radius:99px;border:1px solid var(--bd2);background:var(--sf);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.08);display:inline-flex;align-items:center;gap:6px}
.dock button.pr{background:var(--ink);color:#fff;border-color:var(--ink)}
.dock b{background:#FFD24D;color:var(--ink);border-radius:99px;padding:0 6px;font-size:10px}
.cmp{position:fixed;left:18px;bottom:62px;width:270px;background:var(--sf);border:1px solid var(--bd2);border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:32}
.cmp textarea{width:100%;border:1px solid var(--bd2);border-radius:8px;padding:8px;font-size:13px;min-height:66px;resize:none}
.cmp .r{display:flex;gap:6px;align-items:center;margin-top:8px}
.cmp select{font-size:11px;padding:5px 7px;border-radius:7px;border:1px solid var(--bd2);background:#fff}
.cdots{display:flex;gap:6px}
.cdots button{width:18px;height:18px;border-radius:50%;border:2px solid transparent;padding:0}
.cdots button.on{border-color:var(--ink)}
.nlist{position:fixed;left:18px;bottom:62px;width:300px;max-height:60vh;overflow:auto;background:var(--sf);border:1px solid var(--bd2);border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:32}
.nl{padding:8px 10px;border-radius:6px;background:#FFF3B0;font-size:12px;margin-bottom:6px;line-height:1.4}
.nl.p{background:#FFD9E6}.nl.b{background:#D9ECFF}
.nl .m{font-size:10px;opacity:.65;margin-top:4px;display:flex;gap:8px}
.nl .m button{margin-left:auto;font-size:10px;border:none;background:rgba(255,255,255,.7);border-radius:5px;padding:1px 6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:var(--sf);border-radius:14px;width:860px;max-width:100%;max-height:92vh;overflow:auto;padding:20px}
.md h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.md h2 .r{margin-left:auto;display:flex;gap:6px}

/* kol */
.kol{display:grid;grid-template-columns:120px 1fr 90px repeat(4,56px) 60px;gap:8px;align-items:center;padding:10px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;font-size:12.5px}
.kol input[type=text]{border:none;background:transparent;font-size:12.5px;width:100%;padding:3px 0;border-bottom:1px solid transparent}
.kol input[type=text]:focus{outline:none;border-bottom-color:var(--bd2)}
.kol .st{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--tx3)}
.kol .st input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.kol.hd{background:transparent;border:none;font-size:10px;color:var(--tx3);padding:0 12px}

/* settings */
.srow{display:grid;grid-template-columns:1fr 100px 90px 70px 60px;gap:8px;align-items:center;padding:8px 10px;background:var(--sf);border:1px solid var(--bd);border-radius:9px;margin-bottom:6px;font-size:12.5px}
.srow input,.srow select{padding:5px 8px;border:1px solid var(--bd2);border-radius:7px;font-size:12px;width:100%}
.srow input[type=color]{padding:0;height:28px}
.erow{display:grid;grid-template-columns:130px 1fr 90px 60px;gap:8px;align-items:center;margin-bottom:6px}
.erow input,.erow select{padding:5px 8px;border:1px solid var(--bd2);border-radius:7px;font-size:12px;width:100%}
.lrow{display:grid;grid-template-columns:100px 130px 130px 1fr 60px;gap:8px;align-items:center;margin-bottom:6px}
.lrow input,.lrow select{padding:5px 8px;border:1px solid var(--bd2);border-radius:7px;font-size:12px;width:100%}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function md(s){ var d=parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate(); }
var WD=['一','二','三','四','五','六','日'];
function wdOf(s){ return WD[(parseYmd(s).getDay()+6)%7]; }
function isWeekend(s){ var w=parseYmd(s).getDay(); return w===0||w===6; }
function personColor(name){ var p=people.find(function(x){return x.name===name;}); return p&&p.color?p.color:'#B06A00'; }
function tint(hex,a){ var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
function whoStyle(name){ if(!name) return 'background:#FFF7E0;border-color:#E8C66B'; var c=personColor(name); return 'background:'+tint(c,.13)+';border-color:'+tint(c,.35); }
function isAdmin(){ return me && me.role==='admin'; }
function staffNames(){ return people.filter(function(p){return p.role!=='admin';}).map(function(p){return p.name;}); }
function toast(msg){ var t=document.createElement('div'); t.textContent=msg; t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1F2430;color:#fff;padding:9px 16px;border-radius:99px;font-size:12px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2)'; document.body.appendChild(t); setTimeout(function(){t.remove();},1800); }
function cycleOf(dateS){ /* 回傳兩週期間 [from,to] */ var n=daysBetween(CYCLE_ANCHOR,dateS); var k=Math.floor(n/14); var from=addDaysS(CYCLE_ANCHOR,k*14); return [from, addDaysS(from,13)]; }
function onLeave(name,dateS){ return leaves.some(function(l){ return l.name===name && dateS>=l.from && dateS<=l.to; }); }
function dutyLabel(ds){ if(!isWeekend(ds)) return ''; var ws=staffNames().filter(function(n){ return tasksOn(ds).some(function(t){return t.who===n&&!t.common;}); }); return ws.length===1?' · '+esc(ws[0]):''; }
function dutyOn(dateS){ /* 週末輪值：沒請假的人 */ return staffNames().filter(function(n){ return !onLeave(n,dateS); }); }

/* ============ TASK HELPERS ============ */
function isDone(t){ return t.count ? (t.done||0)>=t.count : !!t.doneFlag; }
function sortTasks(a,b){ return (a.cat||5)-(b.cat||5) || (a.order||0)-(b.order||0) || (a.createdAt||0)-(b.createdAt||0); }
function sortDoneLast(a,b){ var da=isDone(a)?1:0, dbb=isDone(b)?1:0; return da-dbb || sortTasks(a,b); }
function visibleWho(t){ return filterWho==='all' || t.common || t.who===filterWho || t.assist===filterWho; }
function overdueTasks(){ var td=today(); return tasks.filter(function(t){ return t.date<td && !isDone(t); }).sort(function(a,b){ return a.date<b.date?-1:1; }); }
function tasksOn(ds){ return tasks.filter(function(t){return t.date===ds;}); }

/* 類別推斷：1 當天限動 2 上架準備 3 貼文/Reels 4 KOL 5 請託 */
function catOf(text, platform, count){
  var s=text||'';
  if(/限動|story/i.test(s) || (count && !/影片|快剪|腳本|貼文/.test(s))) return 1;
  if(/上架|快剪|BN|DM|banner|一覽|官網/i.test(s) || platform==='官網') return 2;
  if(/貼文|reels|影片|發文|排程|腳本|剪輯|拍攝|企劃|素材|形象/i.test(s)) return 3;
  if(/KOL|員購|公關|小卡|寄送|請款|邀約|聯名|聯繫/i.test(s)) return 4;
  if(platform==='IG'||platform==='FB'||platform==='TH'||platform==='YT') return 3;
  return 5;
}
/* KPI 種類 */
function kindOf(t){
  var s=t.text||'';
  if(t.cat===1 || /限動/.test(s)) return 'story';
  if(/知識型/.test(s)) return 'knowledge';
  if(t.platform==='FB' && /貼文|發文|預告/.test(s)) return 'fbpost';
  if(/一覽/.test(s) && /快剪|影片/.test(s)) return 'overview';
  if(/快剪/.test(s)) return 'quick';
  if(/形象(影片|片|預告)/.test(s)) return 'brandvideo';
  if(/KOL/i.test(s) && /影片|reels|剪輯/i.test(s)) return 'kolvideo';
  if(/影片|reels|開箱|穿搭實拍/i.test(s)) return 'othervideo';
  if(/貼文/.test(s)) return 'post';
  return 'other';
}
function isVideo(t){ var k=kindOf(t); return k==='quick'||k==='overview'||k==='brandvideo'||k==='kolvideo'||k==='othervideo'; }
function unitsDone(t){ return t.count ? (t.done||0) : (isDone(t)?1:0); }

/* line parser: "限動 IG 新品介紹*8 家榛 +小逸 12:00前" */
function parseLine(line, defaultWho){
  var raw=line.trim(); if(!raw) return null;
  var toks=raw.split(/\s+/);
  var platform='其他', who=defaultWho||'', assist='', count=null, time='', cat=null, textParts=[];
  var names=staffNames();
  var i=0;
  while(i<toks.length){
    var tk=toks[i], up=tk.toUpperCase();
    var ci=CAT_KEYS.indexOf(tk);
    if(i<2 && ci>=0 && ci!==3 && cat==null && toks.length>1){ cat=ci+1; i++; continue; }
    if(i<2 && (up==='IG'||up==='FB'||up==='TH'||up==='THREADS'||up==='YT')){ platform= up==='THREADS'?'TH':up; i++; continue; }
    if(i<2 && (tk==='官網'||tk==='其他')){ platform=tk; i++; continue; }
    break;
  }
  for(;i<toks.length;i++){
    var tk2=toks[i];
    if(tk2.charAt(0)==='+' && names.indexOf(tk2.slice(1))>=0){ assist=tk2.slice(1); continue; }
    if(names.indexOf(tk2)>=0){ who=tk2; continue; }
    var mcount=tk2.match(/^(.*?)[\*×xX](\d+)(篇|則|支|個)?$/);
    if(mcount && mcount[2] && !/^\d+$/.test(mcount[1])){ count=+mcount[2]; if(mcount[1]) textParts.push(mcount[1]); continue; }
    if(/^(\d{1,2}[:：]\d{2}(前)?|\d{1,2}[-–~]\d{1,2}|上午|下午|晚上|早上|中午|\d{1,2}點前?)$/.test(tk2)){ time=time?time+' '+tk2:tk2; continue; }
    textParts.push(tk2);
  }
  if(assist && assist===who) assist='';
  var text=textParts.join(' ').trim(); if(!text) text=raw;
  if(cat==null) cat=catOf(text,platform,count);
  return { line:raw, platform:platform, who:who, assist:assist||null, count:count, time:time, text:text, cat:cat };
}

/* ============ RENDER: shared pieces ============ */
function pfTag(p){ return '<span class="pf '+esc(p)+'">'+esc(p)+'</span>'; }
function qTag(t){
  if(t.count) return '<span class="q">'+(t.done||0)+' / '+t.count+'</span>';
  if(t.time) return '<span class="tm">'+esc(t.time)+'</span>';
  return '';
}
function assistTag(t){ return t.assist?'<span class="as">協助 '+esc(t.assist)+'</span>':''; }
function leaveTag(t){ if(t.leave==='help') return '<span class="tg h">需協助</span>'; if(t.leave==='defer') return '<span class="tg m">改期</span>'; return ''; }
function extraBtns(t){
  var h='';
  if(t.common) return h;
  h+='<button class="xb v'+(t.vhelp?' on':'')+'" data-act="vhelp" data-id="'+t.id+'" title="請 V 支援">V'+(t.vhelp?' '+t.vhelp:'')+'</button>';
  return h;
}
function itemHTML(t, opts){
  opts=opts||{};
  var done=isDone(t), late=t.date<today()&&!done;
  var h='<div class="it'+(done?' done':'')+(late&&opts.late?' late':'')+(t.common?' cm':'')+'" style="'+(t.common?'':whoStyle(t.who))+'" data-id="'+t.id+'" draggable="true">';
  h+='<input type="checkbox" data-act="toggle" data-id="'+t.id+'"'+(done?' checked':'')+'>';
  h+=leaveTag(t)+'<span class="t">'+(t.common?'<span class="lb">共同</span>':pfTag(t.platform))+esc(t.text)+assistTag(t)+'</span>';
  if(t.count && opts.counter){ h+='<span class="cnt"><button data-act="dec" data-id="'+t.id+'" aria-label="減一">−</button><b>'+(t.done||0)+' / '+t.count+'</b><button data-act="inc" data-id="'+t.id+'" aria-label="加一">+</button></span>'; }
  else h+=qTag(t);
  if(opts.btns) h+=extraBtns(t);
  if(opts.showWho && !t.common) h+='<span class="who" style="color:'+personColor(t.who)+'">'+esc(t.who)+'</span>';
  if(opts.showDate) h+='<span class="q l">'+md(t.date)+'</span>';
  h+='<button class="eb" data-act="edit" data-id="'+t.id+'" aria-label="編輯"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>';
  h+='</div>';
  return h;
}
function liHTML(t){
  var done=isDone(t), late=t.date<today()&&!done;
  return '<label class="li'+(done?' done':'')+(late?' late':'')+'" style="'+whoStyle(t.who)+'" data-id="'+t.id+'" draggable="true"><input type="checkbox" data-act="toggle" data-id="'+t.id+'"'+(done?' checked':'')+'><span class="t">'+pfTag(t.platform)+esc(t.text)+assistTag(t)+'</span>'+((t.leave?leaveTag(t):qTag(t))||'<span></span>')+'<button class="eb" data-act="edit" data-id="'+t.id+'" aria-label="編輯"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>'+'</label>';
}

/* ============ RENDER ============ */
function renderAll(){
  var ae=document.activeElement, qaVal=null;
  if(ae && ae.id==='qaInput'){ qaVal=ae.value; }
  else if(ae && (ae.tagName==='TEXTAREA' || (ae.tagName==='INPUT' && ae.type!=='checkbox')) && $('app').contains(ae)){ renderPending=true; return; }
  renderPending=false;
  $('wkLabel').textContent=md(ymd(weekStart))+' – '+md(ymd(addDays(weekStart,6)));
  renderFilter(); renderLinks(); renderCountdown(); renderToday(); renderWeek(); renderStatus(); renderNotes(); renderCal(); renderPlan(); renderKol(); renderSettings();
  $('noteCount').textContent=notes.filter(function(n){return !n.archived;}).length;
  if(qaVal!=null && $('qaInput')){ $('qaInput').value=qaVal; $('qaInput').focus(); }
}
document.addEventListener('focusout', function(){ setTimeout(function(){ if(renderPending) renderAll(); }, 150); });

function renderLinks(){
  $('lnkBox').innerHTML=links.map(function(l){ return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.name)+'</a>'; }).join('')||'<div class="empty">無</div>';
}
function renderFilter(){
  var h='<span class="chip'+(filterWho==='all'?' on':'')+'" data-act="filter" data-who="all">全部</span>';
  staffNames().forEach(function(nm){ var c=personColor(nm); h+='<span class="chip'+(filterWho===nm?' on':'')+'" data-act="filter" data-who="'+esc(nm)+'" style="'+(filterWho===nm?'':'background:'+tint(c,.13)+';color:'+c+';border-color:'+tint(c,.35))+'">'+esc(nm)+'</span>'; });
  $('filterBar').innerHTML=h;
}
function renderCountdown(){
  var td=today();
  var up=events.filter(function(e){return e.date>=td;}).sort(function(a,b){return a.date<b.date?-1:1;}).slice(0,4);
  $('countdown').innerHTML=up.map(function(e){ var d=daysBetween(td,e.date); return '<div class="cdc'+(d<=3?' soon':'')+'"><b>'+d+'</b><div><div style="font-weight:500">'+esc(e.title)+'</div><div style="font-size:10px;color:#8A90A0">'+md(e.date)+' 週'+wdOf(e.date)+'</div></div></div>'; }).join('');
}
function dayListHTML(ds, opts){
  /* 當天清單：共同項目 → 五類 */
  opts=opts||{};
  var list=tasksOn(ds).filter(visibleWho).sort(sortDoneLast), h='';
  var cm=list.filter(function(t){return t.common;});
  cm.forEach(function(t){ h+=itemHTML(t,{counter:true,btns:opts.btns}); });
  var any=cm.length>0;
  for(var c=1;c<=5;c++){
    var gl=list.filter(function(t){return !t.common && (t.cat||5)===c;}); if(!gl.length) continue; any=true;
    h+='<div class="sec">'+c+' '+CATS[c-1]+'</div>';
    gl.forEach(function(t){ h+=itemHTML(t,{counter:true,btns:opts.btns}); });
  }
  if(!any) h+='<div class="empty">未排程</div>';
  return h;
}
function renderToday(){
  var td=today();
  var list=tasksOn(td).filter(visibleWho);
  var done=list.filter(isDone).length;
  var h='<div class="c"><div class="h"><b>今天 '+md(td)+' 週'+wdOf(td)+'</b><span>'+list.length+' 件 · 完成 '+done+'</span></div>';
  var mine=notes.filter(function(n){ return !n.archived && (n.to==='all'||n.to===me.name) && !(n.read&&n.read[me.name]) && n.by!==me.name; });
  if(mine.length && !isAdmin()){ mine.forEach(function(n){ h+='<div class="note-in '+esc(n.color)+'" style="margin-bottom:4px" data-act="note-open" data-id="'+n.id+'"><small>'+esc(n.by)+'</small>'+esc(n.text)+'</div>'; }); }
  h+=dayListHTML(td,{btns:true});
  h+='</div>';
  var od=overdueTasks().filter(visibleWho);
  h+='<div class="c"><div class="h"><b>逾期</b><span>'+od.length+' 件</span></div>';
  if(!od.length) h+='<div class="empty">無</div>';
  od.forEach(function(t){ h+=itemHTML(t,{showWho:true,showDate:true,late:true}); });
  h+='</div>';
  /* 請假待處理（兩人都看得到） */
  var pend=pendingLeaveTasks();
  if(pend.length){ h+='<div class="c"><div class="h"><b>請假待分配</b><span style="color:var(--red);font-weight:700">'+pend.length+' 件</span></div>'; h+=leaveListHTML(pend); h+='</div>'; }
  $('colToday').innerHTML=h;
}
function renderWeek(){
  var td=today(), h='', names=staffNames();
  h+='<div class="dr hd"><div></div><div class="pg2" style="grid-template-columns:repeat('+names.length+',1fr)">'+names.map(function(n){return '<div class="ph" style="background:'+personColor(n)+'">'+esc(n)+'</div>';}).join('')+'</div></div>';
  for(var i=0;i<7;i++){
    var ds=ymd(addDays(weekStart,i));
    var dl=tasksOn(ds).filter(visibleWho);
    var dn=dl.filter(isDone).length, pct=dl.length?Math.round(dn/dl.length*100):0;
    var evs=events.filter(function(e){return e.date===ds;});
    var pinned=notes.filter(function(n){return !n.archived && n.date===ds;});
    h+='<div class="dr'+(ds===td?' today':'')+(i>=5?' off':'')+'" data-date="'+ds+'">';
    h+='<div class="dd"><div class="n">'+parseYmd(ds).getDate()+'</div><div class="w">週'+WD[i]+dutyLabel(ds)+'</div>';
    evs.forEach(function(e){ h+='<span class="mk">'+esc(e.title)+'</span>'; });
    h+='<div class="pg"><i style="width:'+pct+'%"></i></div><div class="pt">'+dn+' / '+dl.length+'</div></div>';
    h+='<div class="rt">';
    pinned.forEach(function(n){ h+='<div class="note-in '+esc(n.color)+'"><small>'+esc(n.by)+(n.to!=='all'?' → '+esc(n.to):'')+'</small>'+esc(n.text)+'</div>'; });
    dl.filter(function(t){return t.common;}).forEach(function(t){ h+='<label class="cmrow'+(isDone(t)?' done':'')+'"><input type="checkbox" data-act="toggle" data-id="'+t.id+'"'+(isDone(t)?' checked':'')+'><span class="lb">共同</span>'+esc(t.text)+'</label>'; });
    h+='<div class="pg2" style="grid-template-columns:repeat('+names.length+',1fr)">';
    names.forEach(function(nm){
      var pl=dl.filter(function(t){return !t.common && t.who===nm;}).sort(sortDoneLast);
      h+='<div class="pcol" data-drop="1" data-date="'+ds+'" data-who="'+esc(nm)+'"'+(onLeave(nm,ds)?' style="opacity:.45"':'')+'>';
      if(onLeave(nm,ds)) h+='<span class="empty">請假</span>';
      pl.forEach(function(t){ h+=liHTML(t); });
      h+='<button class="addb" data-act="new" data-date="'+ds+'" data-who="'+esc(nm)+'" aria-label="新增">+</button></div>';
    });
    h+='</div></div></div>';
  }
  $('colWeek').innerHTML=h;
}

/* KPI 計算 */
function sumKind(kind, from, to, who){
  var n=0; tasks.forEach(function(t){ if(t.date<from||t.date>to||t.common) return; if(who && t.who!==who) return; if(kindOf(t)!==kind) return; n+=unitsDone(t); }); return n;
}
function storyTarget(from,to,who){
  var n=0; for(var d=from; d<=to; d=addDaysS(d,1)){ if(onLeave(who,d)) continue; if(isWeekend(d)){ if(tasksOn(d).some(function(t){return t.who===who && !t.common;})) n+=KPI.storyWeekend; } else n+=KPI.storyWeekday; } return n;
}
function kpiRow(label, val, target, tmax){
  var cls = target? (val>=target?' ok':(val<target*0.6?' ng':'')) : '';
  var p = target? Math.min(100,Math.round(val/target*100)) : 0;
  return '<span>'+label+'</span><span class="v'+cls+'">'+val+(target?' / '+target+(tmax&&tmax!==target?'–'+tmax:''):'')+'</span>'+(target?'<div class="bar"><i style="width:'+p+'%"></i></div>':'');
}
function renderStatus(){
  var td=today(), h='', names=staffNames();
  var ws=ymd(weekStart), we=ymd(addDays(weekStart,6));
  var cyc=cycleOf(td), m=td.slice(0,7), mFrom=m+'-01', mTo=m+'-31';
  h+='<div class="c"><div class="h"><b>KPI</b><span>本週 '+md(ws)+' – '+md(we)+'</span></div><div class="kp">';
  h+='<span class="g">限動 · 今天</span>';
  names.forEach(function(nm){ var v=sumKind('story',td,td,nm), tg=storyTarget(td,td,nm); h+='<span><span class="who" style="color:'+personColor(nm)+';font-size:11px">'+esc(nm)+'</span></span><span class="v'+(tg?(v>=tg?' ok':(v<tg*0.6?' ng':'')):'')+'">'+v+' / '+tg+'</span>'; });
  h+='<span class="g">貼文 · 本週</span>';
  h+=kpiRow('FB 貼文 每天 '+KPI.fbPerDay, sumKind('fbpost',ws,we), KPI.fbPerDay*7);
  h+=kpiRow('IG 知識型 每週 '+KPI.knowledgePerWeek, sumKind('knowledge',ws,we), KPI.knowledgePerWeek);
  h+='<span class="g">影片 · 本週</span>';

  h+=kpiRow('KOL 企劃影片 每週 '+KPI.kolVideoPerWeek, sumKind('kolvideo',ws,we), KPI.kolVideoPerWeek);
  h+=kpiRow('一覽快剪 每週 1–2', sumKind('overview',ws,we), KPI.overviewPerWeekMin, KPI.overviewPerWeekMax);
  h+=kpiRow('其他影片 每週 1–2', sumKind('othervideo',ws,we), KPI.otherVideoPerWeekMin, KPI.otherVideoPerWeekMax);
  h+=kpiRow('形象影片 每月 '+KPI.brandVideoPerMonth, sumKind('brandvideo',mFrom,mTo), KPI.brandVideoPerMonth);
  if(isAdmin()){ h+='<span class="g">本期 '+md(cyc[0])+' – '+md(cyc[1])+'</span>'; h+='<span>V 支援</span><span class="v">'+countLog('vhelp',cyc[0],cyc[1])+' 次</span>'; }
  h+='</div></div>';
  /* 完成率 */
  h+='<div class="c"><div class="h"><b>完成率</b></div><table class="tbl"><tr><th></th><th>本週</th><th>本期</th><th>逾期</th></tr>';
  names.forEach(function(nm){ var a=statsFor(nm,ws,we),b=statsFor(nm,cyc[0],cyc[1]); var od=overdueTasks().filter(function(t){return t.who===nm;}).length; h+='<tr><td><span class="who" style="color:'+personColor(nm)+';font-size:11px">'+esc(nm)+'</span></td><td>'+a.p+'% <span class="sm">'+a.d+'/'+a.n+'</span></td><td>'+b.p+'% <span class="sm">'+b.d+'/'+b.n+'</span></td><td'+(od?' style="color:#B03A3A;font-weight:700"':'')+'>'+od+'</td></tr>'; });
  h+='</table></div>';
  /* 便利貼 */
  if(isAdmin()){
    var mineN=notes.filter(function(n){return !n.archived && n.by===me.name;});
    var unread=mineN.filter(function(n){ var tg=n.to==='all'?names:[n.to]; return tg.some(function(x){return !(n.read&&n.read[x]);}); }).length;
    h+='<div class="c"><div class="h"><b>便利貼</b><span>'+mineN.length+' 張 · '+unread+' 未讀</span></div></div>';
  }
  /* 下次會議 */
  var next=cycleOf(td)[1]; var nextMeet=addDaysS(next,1);
  var nws=ymd(addDays(weekStart,7)), nwe=ymd(addDays(weekStart,13));
  var nt=tasks.filter(function(t){return t.date>=nws&&t.date<=nwe&&!t.common;}).length;
  h+='<div class="c"><div class="h"><b>下次會議</b><span>兩週一次</span></div><div style="font-size:12px;color:#6A7085;line-height:1.7">'+md(nextMeet)+' 週'+wdOf(nextMeet)+' 排 '+md(nextMeet)+' – '+md(addDaysS(nextMeet,13))+'<br>'+(isAdmin()?md(nextMeet)+' 兩週檢視 · <a href="#" data-act="meeting">報表</a><br>':'')+'下週 '+(nt?'已排 '+nt+' 件':'尚未排程')+' · <a href="#" data-act="go-plan-next">排程</a></div></div>';

function savePlan(ds,nm){
  var ta=document.querySelector('textarea[data-plan="'+ds+'"][data-who="'+nm+'"]'); if(!ta) return Promise.resolve();
  var text=ta.value;
  var lines=text.split('\n').map(function(l){return l.trim();}).filter(Boolean);

  if(parsed.some(function(p){return !p.who;})){ toast('有未標主責的行'); return Promise.reject('bad'); }
  var existing=tasksOn(ds).filter(function(t){return !t.common && t.who===nm;});
  var batch=db.batch(), used={};

    var hit=existing.find(function(t){ return !used[t.id] && t.line===p.line; });
    if(hit){ used[hit.id]=true; batch.update(db.collection(COL.tasks).doc(hit.id),{order:idx}); return; }
    var ref=db.collection(COL.tasks).doc();

  });

}

function makeDraggable(el,n){
  var sx,sy,ox,oy,drag=false,moved=false;
  function down(e){ if(e.target.tagName==='BUTTON') return; var p=e.touches?e.touches[0]:e; drag=true; moved=false; sx=p.clientX; sy=p.clientY; ox=el.offsetLeft; oy=el.offsetTop; el.style.zIndex=99; if(!e.touches) e.preventDefault(); }
  function move(e){ if(!drag) return; var p=e.touches?e.touches[0]:e; var dx=p.clientX-sx, dy=p.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>3) moved=true; el.style.left=Math.max(0,ox+dx)+'px'; el.style.top=Math.max(0,oy+dy)+'px'; if(e.touches) e.preventDefault(); }
  function up(){ if(!drag) return; drag=false; el.style.zIndex=''; if(moved){ db.collection(COL.notes).doc(n.id).update({x:el.offsetLeft,y:el.offsetTop}); } }
  el.addEventListener('mousedown',down); document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  el.addEventListener('touchstart',down,{passive:true}); el.addEventListener('touchmove',move,{passive:false}); el.addEventListener('touchend',up);
}

/* ============ MEETING / REPORT ============ */
function reportText(from,to){
  var names=staffNames(), L=[];
  L.push('兩週檢視 '+md(from)+' – '+md(to));
  names.forEach(function(nm){ var s=statsFor(nm,from,to); L.push(nm+' 完成率 '+s.p+'% ('+s.d+'/'+s.n+')'); L.push('  限動 '+sumKind('story',from,to,nm)+' / '+storyTarget(from,to,nm)); });
  L.push('FB 貼文 '+sumKind('fbpost',from,to)+' / '+KPI.fbPerDay*14);
  L.push('知識型貼文 '+sumKind('knowledge',from,to)+' / '+KPI.knowledgePerWeek*2);
  L.push('快剪 '+sumKind('quick',from,to)+' / '+KPI.quickPerWeekMin*2+'–'+KPI.quickPerWeekMax*2);
  L.push('一覽快剪 '+sumKind('overview',from,to)+' / '+KPI.overviewPerWeekMin*2+'–'+KPI.overviewPerWeekMax*2);
  L.push('KOL 企劃影片 '+sumKind('kolvideo',from,to)+' / '+KPI.kolVideoPerWeek*2);
  L.push('其他影片 '+sumKind('othervideo',from,to)+' / '+KPI.otherVideoPerWeekMin*2+'–'+KPI.otherVideoPerWeekMax*2);
  L.push('形象影片 '+sumKind('brandvideo',from,to));
  L.push('V 支援 '+countLog('vhelp',from,to)+' 次');
  var und=tasks.filter(function(t){return t.date>=from&&t.date<=to&&!t.common&&!isDone(t);});
  L.push('未完成 '+und.length+' 件');
  return L.join('\n');
}

var autoBusy=false;
function ensureAutoItems(){
  if(autoBusy || !me) return;
  var td=today(), b=db.batch(), n=0;
  function ensure(id, date, text, extra){
    if(date<td) return;
    if(allTasks.some(function(t){return t.id===id;})) return;
    b.set(db.collection(COL.tasks).doc(id), Object.assign({date:date,line:text,text:text,platform:'其他',who:'',assist:null,cat:2,count:null,time:'',done:0,doneFlag:false,order:-1,common:true,auto:true,createdAt:Date.now(),createdBy:'auto'},extra||{})); n++;
  }
  events.forEach(function(e){ if(e.kind==='launch'){ ensure('auto_ev_'+e.id, addDaysS(e.date,-1), '確認 '+md(e.date)+' 上架日限動：題目、負責人、發布時間', {eventId:e.id}); } });
  var now=new Date();
  for(var k=0;k<2;k++){ var y=now.getFullYear(), m=now.getMonth()+k; var mm=new Date(y,m,1); var ym=mm.getFullYear()+'-'+pad(mm.getMonth()+1);
    REMINDERS.forEach(function(r){ var last=new Date(mm.getFullYear(),mm.getMonth()+1,0).getDate(); var d=ym+'-'+pad(Math.min(r.day,last)); ensure('auto_'+r.key+'_'+ym, d, r.text, {cat:4}); }); }
  if(n){ autoBusy=true; b.commit().then(function(){ autoBusy=false; }).catch(function(){ autoBusy=false; }); }
}

    if(v.indexOf('to:')===0){ var nn=v.slice(3); db.collection(COL.tasks).doc(t.id).update({who:nn,assist:null,leave:'moved',line:(t.line||t.text).replace(t.who,'').trim()}); toast('已改由 '+nn); }
    else if(v==='defer'){ var l=leaves.find(function(x){return x.id===t.leaveId;}); var nd=l?nextWorkday(l.to):addDaysS(t.date,7); db.collection(COL.tasks).doc(t.id).update({leave:'defer',origDate:t.date,date:nd}); toast('已改期 '+md(nd)); }
    else if(v==='drop'){ db.collection(COL.tasks).doc(t.id).delete(); toast('已減量'); }
    return; }
});
document.addEventListener('input', function(e){
  var el=e.target;
  if(el.dataset.plan){ var k=planKey(el.dataset.plan,el.dataset.who); dirty[k]=el.value; el.classList.add('dirty'); var pv=document.querySelector('[data-preview="'+k+'"]'); if(pv) pv.innerHTML=previewHTML(el.value,el.dataset.who); var bt=document.querySelector('[data-act="plan-save"][data-date="'+el.dataset.plan+'"][data-who="'+el.dataset.who+'"]'); if(bt) bt.textContent='儲存 *'; updatePlanBad(); }
});
document.addEventListener('click', function(e){ if(!e.target.closest('#lnkBox') && !e.target.closest('[data-act="links"]')) $('lnkBox').classList.add('hide'); });
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ $('lnkBox').classList.add('hide'); $('cmp').classList.add('hide'); $('nlist').classList.add('hide'); $('modal').classList.add('hide'); }
  if(e.key==='Enter' && e.target.id==='qaInput'){ e.preventDefault(); quickAdd(); }
});
$('modal').addEventListener('click', function(e){ if(e.target===$('modal')) $('modal').classList.add('hide'); });
function openEdit(id, preset){
  var t=preset||tasks.find(function(x){return x.id===id;}); if(!t) return;
  var names=staffNames();
  var h='<h2>'+(preset?'新增':'編輯')+'<span class="r"><button class="btn sm" data-act="modal-close">關閉</button></span></h2><div class="frm">';
  h+='<span>內容</span><input id="edLine" value="'+esc(t.common?t.text:(t.line||t.text))+'">';
  h+='<span>日期</span><input type="date" id="edDate" value="'+esc(t.date)+'">';
  if(!t.common){
    h+='<span>主責</span><select id="edWho">'+names.map(function(n){return '<option'+(n===t.who?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>';
    h+='<span>協助</span><select id="edAssist"><option value="">無</option>'+names.map(function(n){return '<option'+(n===t.assist?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>';
    if(!preset) h+='<span>類別</span><select id="edCat">'+CATS.map(function(c,i){return '<option value="'+(i+1)+'"'+((t.cat||5)===i+1?' selected':'')+'>'+(i+1)+' '+c+'</option>';}).join('')+'</select>';
  }
  h+='</div><div style="display:flex;gap:8px;margin-top:16px">'+(preset?'':'<button class="btn dn" data-act="edit-del" data-id="'+id+'">刪除</button>')+'<button class="btn pr" style="margin-left:auto" data-act="edit-save" data-id="'+(preset?'':id)+'">儲存</button></div>';
  $('modalBody').innerHTML=h; $('modalBody').style.width='460px'; $('modal').classList.remove('hide');
  if(preset) setTimeout(function(){ $('edLine').focus(); },50);
}
function saveEdit(id){
  var line=$('edLine').value.trim(), date=$('edDate').value; if(!line||!date){ toast('內容或日期不完整'); return; }
  if(!id){
    var w0=$('edWho').value, a0=$('edAssist').value, p0=parseLine(line,w0);
    db.collection(COL.tasks).add({date:date,line:p0.line,text:p0.text,platform:p0.platform,who:w0,assist:(a0&&a0!==w0)?a0:null,cat:p0.cat,count:p0.count,time:p0.time,done:0,doneFlag:false,order:tasksOn(date).length,common:false,createdAt:Date.now(),createdBy:me.name}).then(function(){ $('modal').classList.add('hide'); toast('已新增'); });
    return;
  }
  var t=tasks.find(function(x){return x.id===id;}); if(!t) return;
  var u={date:date};
  if(t.common){ u.text=line; u.line=line; }
  else {
    var who=$('edWho').value, as=$('edAssist').value, cat=+$('edCat').value;
    var p=parseLine(line, who);
    u.line=p.line; u.text=p.text; u.platform=p.platform; u.time=p.time; u.who=who; u.assist=(as&&as!==who)?as:null;
    u.cat=(line!==(t.line||t.text) && cat===(t.cat||5))?p.cat:cat;
    if((p.count||null)!==(t.count||null)){ u.count=p.count; u.done=Math.min(t.done||0,p.count||0); if(!p.count) u.doneFlag=isDone(t); }
  }
  db.collection(COL.tasks).doc(id).update(u).then(function(){ $('modal').classList.add('hide'); toast('已儲存'); });
}
/* 拖移：改日期／改主責 */
var dragId=null;
document.addEventListener('dragstart', function(e){ var el=e.target.closest&&e.target.closest('[draggable=true][data-id]'); if(!el) return; dragId=el.dataset.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragId); }catch(x){} });
document.addEventListener('dragend', function(e){ dragId=null; document.querySelectorAll('.dragging,.dropon').forEach(function(x){ x.classList.remove('dragging'); x.classList.remove('dropon'); }); });
document.addEventListener('dragover', function(e){ if(!dragId) return; var z=e.target.closest&&e.target.closest('[data-drop]'); if(!z) return; e.preventDefault(); document.querySelectorAll('.dropon').forEach(function(x){ if(x!==z) x.classList.remove('dropon'); }); z.classList.add('dropon'); });
document.addEventListener('drop', function(e){
  if(!dragId) return; var z=e.target.closest&&e.target.closest('[data-drop]'); if(!z) return; e.preventDefault();
  var t=tasks.find(function(x){return x.id===dragId;}); dragId=null; if(!t) return;
  var u={}; if(z.dataset.date && z.dataset.date!==t.date) u.date=z.dataset.date;
  if(z.dataset.who && !t.common && z.dataset.who!==t.who){ u.who=z.dataset.who; u.line=(t.line||t.text).split(/\s+/).filter(function(k){return k!==t.who;}).join(' '); if(t.assist===u.who) u.assist=null; }
  if(!Object.keys(u).length) return;
  db.collection(COL.tasks).doc(t.id).update(u).then(function(){ toast('已移動'+(u.date?' '+md(u.date):'')+(u.who?' '+u.who:'')); });
});
function quickAdd(){
  var inp=$('qaInput'); if(!inp) return; var line=inp.value.trim(); if(!line) return;
  var ds=inp.dataset.date; var p=parseLine(line, isAdmin()?'':me.name);
  if(!p.who){ toast('未標主責'); return; }
  var order=tasksOn(ds).length;
  db.collection(COL.tasks).add({date:ds,line:p.line,text:p.text,platform:p.platform,who:p.who,assist:p.assist,cat:p.cat,count:p.count,time:p.time,done:0,doneFlag:false,order:order,common:false,createdAt:Date.now(),createdBy:me.name}).then(function(){ inp.value=''; inp.focus(); });
}

function setView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on',t.dataset.view===v); });
  ['desk','cal','plan','kol','settings'].forEach(function(k){ $('v'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('hide',k!==v); });
  renderAll();
}
function setMobile(mv){
  mobileView=mv;
  document.querySelectorAll('.bnav button').forEach(function(b){ b.classList.toggle('on',b.dataset.mv===mv); });
  if(mv==='plan'||mv==='cal'){ setView(mv); return; }
  setView('desk');
  document.querySelectorAll('.desk .col').forEach(function(c){ c.classList.toggle('mv',c.id===mv); });
}

/* ============ DATA ============ */
function listen(){
  unsub.forEach(function(u){u();}); unsub=[];
  var from=ymd(addDays(mondayOf(new Date()),-70));
  unsub.push(db.collection(COL.tasks).where('date','>=',from).onSnapshot(function(s){ allTasks=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); tasks=allTasks.filter(function(t){return !t.deleted;}); renderAll(); ensureAutoItems(); }));
  unsub.push(db.collection(COL.notes).onSnapshot(function(s){ notes=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderAll(); if(!$('nlist').classList.contains('hide')) renderNoteList(); }));
  unsub.push(db.collection(COL.events).onSnapshot(function(s){ events=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderAll(); ensureAutoItems(); }));
  unsub.push(db.collection(COL.kols).onSnapshot(function(s){ kols=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderKol(); }));
  unsub.push(db.collection(COL.leaves).onSnapshot(function(s){ leaves=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderAll(); }));
  unsub.push(db.collection(COL.logs).where('date','>=',from).onSnapshot(function(s){ logs=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderStatus(); }));
  unsub.push(db.collection(COL.settings).doc('links').onSnapshot(function(d){ if(d.exists && d.data().list) links=d.data().list; renderLinks(); if(view==='settings') renderSettings(); }));
  unsub.push(db.collection(COL.settings).doc('people').onSnapshot(function(d){ if(d.exists){ people=d.data().list||[]; var m=people.find(function(p){return p.email.toLowerCase()===me.email.toLowerCase();}); if(m) Object.assign(me,m); } applyMe(); renderAll(); }));
}
function applyMe(){
  $('meChip').textContent=me.name; $('meChip').style.background=me.color||'#2F6FED';
  $('tabSettings').classList.toggle('hide',!isAdmin());
  $('btnMeeting').classList.toggle('hide',!isAdmin());
}

/* ============ AUTH ============ */
$('loginForm').addEventListener('submit', function(e){
  e.preventDefault(); $('lgErr').textContent='';
  var lem=$('lgEmail').value.trim(), lpw=$('lgPw').value;
  auth.signInWithEmailAndPassword(lem, lpw).catch(function(err){
    if(lem.toLowerCase()===SEED_ADMIN.email && (err.code==='auth/invalid-credential'||err.code==='auth/user-not-found') && lpw.length>=6){
      return auth.createUserWithEmailAndPassword(lem, lpw).then(function(){ toast('管理者帳號已建立'); }).catch(function(e2){
        $('lgErr').textContent = e2.code==='auth/email-already-in-use' ? '信箱或密碼不對' : ('建立失敗：'+e2.code);
      });
    }
    var m={'auth/invalid-credential':'信箱或密碼不對','auth/user-not-found':'信箱或密碼不對','auth/wrong-password':'信箱或密碼不對','auth/invalid-email':'信箱格式不對','auth/operation-not-allowed':'尚未開啟 Email 登入','auth/too-many-requests':'嘗試次數過多，請稍後再試'};
    $('lgErr').textContent=m[err.code]||('登入失敗：'+err.code);
  });
});
auth.onAuthStateChanged(function(user){
  if(!user){ me=null; unsub.forEach(function(u){u();}); unsub=[]; $('app').classList.add('hide'); $('login').classList.remove('hide'); return; }
  db.collection(COL.settings).doc('people').get().then(function(d){
    var list=d.exists?(d.data().list||[]):[];
    if(!d.exists){ list=[SEED_ADMIN]; db.collection(COL.settings).doc('people').set({list:list}); }
    people=list;
    var m=list.find(function(p){return p.email.toLowerCase()===user.email.toLowerCase();});
    if(!m){ $('lgErr').textContent='此信箱尚未加入成員'; auth.signOut(); return; }
    me=Object.assign({uid:user.uid,email:user.email},m);
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    applyMe(); setView('desk'); listen();
  });
});
window.addEventListener('resize', function(){ renderNotes(); });

</script>
